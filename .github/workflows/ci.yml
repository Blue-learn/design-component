name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pick the package manager from whichever lockfile is committed.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f yarn.lock ]; then
            echo "manager=yarn"        >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm"        >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm"         >> "$GITHUB_OUTPUT"
            echo "install=npm ci"      >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: ${{ steps.pm.outputs.manager }}

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      # Each step is skipped when the repo does not define that script, so this
      # same workflow drops cleanly into repos at different stages of maturity.
      - name: Lint
        run: npm run --if-present lint

      - name: Type check
        run: npm run --if-present typecheck

      - name: Test
        run: npm run --if-present test

      - name: Build
        run: npm run --if-present build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
